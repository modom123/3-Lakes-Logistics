name: Build Android AAB — Light Fleet (Google Play)

on:
  push:
    branches: [main]
    paths:
      - 'driver-pwa/lf.html'
      - 'driver-pwa/login-lf.html'
      - 'driver-pwa/manifest-lf.json'
      - 'driver-pwa/icons/icon-lf-*.png'
      - 'shared/**'
      - 'capacitor-lf.config.json'
      - 'scripts/build-mobile-lf.sh'
      - '.github/workflows/android-build-lf.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (integer, increment each release)'
        required: true
        default: '1'
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-lf:
    name: Build & Sign Light Fleet AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Java 21 ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── 3. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      # ── 4. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── 5. Install JS deps ───────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 6. Activate Light Fleet Capacitor config ──────────────────────────────
      - name: Use Light Fleet capacitor config
        run: cp capacitor-lf.config.json capacitor.config.json

      # ── 7. Build LF mobile web assets (www/) ─────────────────────────────────
      - name: Build Light Fleet mobile web assets
        run: bash scripts/build-mobile-lf.sh

      # ── 8. Add Android platform & sync ───────────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 9. Set version code/name ──────────────────────────────────────────────
      - name: Set version code and name
        run: |
          VERSION_CODE="${{ github.event.inputs.version_code || '1' }}"
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      # ── 10. Add required Android permissions ───────────────────────────────────
      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' "$MANIFEST"
          fi

      # ── 11. Decode keystore from secret ────────────────────────────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/3lakes-release.keystore

      # ── 12. Build signed AAB ───────────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/3lakes-release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── 13. Upload AAB artifact ────────────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3lakes-lightfleet-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 14. Build debug APK for testing ───────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 3lakes-lightfleet-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── 15. Auto-upload to Google Play via fastlane ────────────────────────────
      - name: Set up Ruby for fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_KEY_BASE64: ${{ secrets.GOOGLE_PLAY_KEY_BASE64 }}
        run: |
          echo "$GOOGLE_PLAY_KEY_BASE64" | base64 --decode > fastlane/google-play-key.json

      - name: Upload AAB to Google Play (internal track)
        continue-on-error: true
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: fastlane/google-play-key.json
        run: |
          fastlane android upload_lf_to_play \
            aab:$GITHUB_WORKSPACE/android/app/build/outputs/bundle/release/app-release.aab \
            version_name:${{ github.event.inputs.version_name || '1.0.0' }}
