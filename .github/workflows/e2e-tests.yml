name: E2E Tests — driver apps (Playwright)

# Browser-driven end-to-end tests for the mobile driver surfaces:
#   • Falcon heavy driver portal  — driver-pwa/login.html + index.html
#   • Falcon light driver portal  — driver-pwa/login-lf.html + lf.html
# The specs mock the backend via page.route(), and playwright.config.js serves
# the static surfaces itself (python -m http.server), so this needs no live
# backend and no secrets — just a browser.

on:
  push:
    branches: ['**']
    paths:
      - 'driver-pwa/**'
      - 'light-fleet.html'
      - 'driver-heavy.html'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'driver-pwa/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Driver app E2E (Mobile Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
