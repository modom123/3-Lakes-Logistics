name: Deploy Website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'public/**'
      - 'driver-pwa/**'
      - 'shared/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: FTP deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Stage all website files into dist/
      - name: Prepare website files
        run: |
          mkdir -p dist
          # All root-level public HTML pages
          cp *.html dist/
          # website.html is the source-of-truth public site —
          # Hostinger serves index.html as the default, so keep them in sync.
          cp website.html dist/index.html
          # eagleeye.html is the INTERNAL command center (hosted on Vercel) —
          # never publish it to the public Hostinger site.
          rm -f dist/eagleeye.html
          # Falcon driver portal (PWA) — served at /driver-pwa/ on the same
          # domain the backend texts to drivers (FALCON_URL). It loads
          # /shared/config.js, so ship shared/ too.
          mkdir -p dist/driver-pwa dist/shared
          cp -r driver-pwa/. dist/driver-pwa/
          cp -r shared/. dist/shared/
          # Google site verification + any other public files
          cp -r public/. dist/
          echo "Files to deploy:"
          ls -la dist/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:    ${{ secrets.HOSTINGER_FTP_HOST }}
          username:  ${{ secrets.HOSTINGER_FTP_USER }}
          password:  ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
