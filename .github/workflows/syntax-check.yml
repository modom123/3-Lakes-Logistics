name: 3 Lakes Syntax CI

on: [push, pull_request]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make syntax_test.sh executable
        run: chmod +x syntax_test.sh

      - name: Run Unified Syntax Tests
        run: ./syntax_test.sh
