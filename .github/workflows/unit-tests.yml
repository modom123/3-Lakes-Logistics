name: Unit Tests — offline (test_system)

# Fast, hermetic suite that runs on every push/PR. No secrets, no network:
# all external HTTP (load boards) and the database are mocked. Complements the
# nightly live-API suite. Runs on Python 3.12 to match the deployment image
# (backend/Dockerfile: python:3.12-slim) — the backend uses PEP 701 f-strings.

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - 'tests/test_system.py'
      - 'tests/fixtures/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/test_system.py'
      - 'tests/fixtures/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline system tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt
          pip install pytest

      - name: Run offline system + whole-system suites
        run: pytest tests/test_system.py tests/test_whole_system.py -v --tb=short --no-header
