[pytest]
# 3 Lakes Logistics — pytest configuration
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default markers
markers =
    live: marks tests that require live external services (Supabase, Stripe, Anthropic)
    slow: marks tests that take >5s to run
    rls: marks Supabase RLS integration tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header

# Ignore directories that aren't test files
norecursedirs =
    .git
    __pycache__
    .mypy_cache
    node_modules
    .github
    backend/app
    golden_datasets
