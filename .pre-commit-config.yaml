repos:
  # ── Standard hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '.*\.(pdf|png|mp4|zip|docx)$'
      - id: check-yaml
      - id: check-json
        exclude: 'package-lock\.json'
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── Secret scanning — blocks Stripe/Motive/Vapi/Twilio keys ──────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - '.*\.(pdf|png|mp4|zip|docx)$'
          - --exclude-files
          - 'tests/golden_datasets/.*'
          - --plugin
          - StripeDetector
          - --plugin
          - TwilioKeyDetector
          - --plugin
          - SendGridDetector
          - --plugin
          - KeywordDetector
          - --plugin
          - HexHighEntropyString
          - --plugin
          - JwtTokenDetector
          - --plugin
          - PrivateKeyDetector
        name: Scan for hardcoded secrets (Stripe, Vapi, Motive, Twilio)

  # ── Security linting — catch SQL injection, command injection, etc. ───────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args:
          - -r
          - backend/app
          - --severity-level
          - medium
          - --confidence-level
          - medium
          - -x
          - backend/app/__pycache__
        name: Bandit security lint (medium+ severity)
        pass_filenames: false

  # ── Type checking ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy type check (backend/app)
        args:
          - --config-file=mypy.ini
          - --no-error-summary
        files: ^backend/app/.*\.py$
        additional_dependencies:
          - pydantic==2.9.2
          - pydantic-settings==2.5.2
          - types-requests
          - types-redis
        pass_filenames: false

  # ── Python formatting ─────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        files: ^backend/.*\.py$
        args: [--line-length=100]

  # ── Import sorting ────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend/.*\.py$
        args: [--profile=black, --line-length=100]
