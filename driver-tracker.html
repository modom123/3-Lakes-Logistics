<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>3 Lakes GPS Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
:root{--gold:#c9a227;--gold2:#f0c040;--green:#16a34a;--red:#dc2626;--surface:#141414;--border:#2a2a2a;}

#setup-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:20px;}
.logo-text{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--gold);text-align:center;}
.logo-sub{font-size:12px;color:#666;margin-top:4px;text-align:center;}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:360px;}
.setup-card h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--gold);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;color:#888;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
.field input{width:100%;background:#1a1a1a;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:15px;color:#fff;outline:none;}
.field input:focus{border-color:var(--gold);}
.btn-start{width:100%;padding:16px;background:var(--gold);color:#000;border:none;border-radius:10px;font-size:17px;font-weight:800;cursor:pointer;letter-spacing:.3px;margin-top:4px;}
.btn-start:active{opacity:.85;}

#tracker-screen{flex:1;display:none;flex-direction:column;}
.top-bar{background:#000;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.top-bar-logo{font-size:14px;font-weight:800;color:var(--gold);}
.top-truck{font-size:13px;color:#aaa;font-weight:600;}

.status-hero{padding:24px 16px 16px;text-align:center;background:var(--surface);border-bottom:1px solid var(--border);}
.pulse-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;}
.pulse-dot{width:14px;height:14px;border-radius:50%;background:var(--green);position:relative;flex-shrink:0;}
.pulse-dot.active::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:var(--green);opacity:.4;animation:pulse 1.4s ease-out infinite;}
.pulse-dot.stopped{background:#555;}
.pulse-dot.stopped::after{display:none;}
@keyframes pulse{0%{transform:scale(1);opacity:.4;}100%{transform:scale(2.2);opacity:0;}}
.status-label{font-size:18px;font-weight:700;letter-spacing:.3px;}
.status-label.active{color:var(--green);}
.status-label.stopped{color:#555;}
.ping-time{font-size:12px;color:#666;margin-top:4px;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);}
.stat-cell{background:var(--surface);padding:16px;text-align:center;}
.stat-val{font-size:24px;font-weight:800;color:var(--gold2);}
.stat-lbl{font-size:11px;color:#666;margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}

.section{padding:14px 16px;border-bottom:1px solid var(--border);}
.section-title{font-size:11px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}

.hos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hos-btn{padding:10px 6px;background:#1a1a1a;border:2px solid var(--border);border-radius:8px;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;}
.hos-btn.active{border-color:var(--gold);background:rgba(201,162,39,.12);color:var(--gold);}
.hos-btn:active{opacity:.8;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;}
.toggle-label{font-size:14px;color:#ccc;}
.toggle-sub{font-size:11px;color:#555;margin-top:2px;}
.toggle-sw{position:relative;width:44px;height:26px;flex-shrink:0;}
.toggle-sw input{opacity:0;width:0;height:0;}
.toggle-sw .slider{position:absolute;inset:0;background:#333;border-radius:13px;cursor:pointer;transition:.2s;}
.toggle-sw .slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle-sw input:checked+.slider{background:var(--gold);}
.toggle-sw input:checked+.slider::before{transform:translateX(18px);}

.btn-main{width:calc(100% - 32px);margin:16px;padding:18px;border:none;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.3px;}
.btn-main.start{background:var(--gold);color:#000;}
.btn-main.stop{background:#1a1a1a;color:var(--red);border:2px solid var(--red);}
.btn-main:active{opacity:.8;transform:scale(.98);}

.accuracy-row{font-size:11px;color:#555;text-align:center;padding:4px 16px 12px;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div>
    <div class="logo-text">3 LAKES LOGISTICS</div>
    <div class="logo-sub">Driver GPS Tracking</div>
  </div>
  <div class="setup-card">
    <h2>Start Tracking</h2>
    <div class="field"><label>Truck ID</label><input id="f-truck" placeholder="e.g. TRK-001" autocapitalize="characters"></div>
    <div class="field"><label>Carrier ID</label><input id="f-carrier" placeholder="e.g. CAR-123" autocapitalize="characters"></div>
    <div class="field"><label>Driver Name (optional)</label><input id="f-name" placeholder="Your name"></div>
    <button class="btn-start" onclick="setupStart()">START TRACKING</button>
  </div>
</div>

<!-- TRACKER SCREEN -->
<div id="tracker-screen">
  <div class="top-bar">
    <div class="top-bar-logo">3 LAKES LOGISTICS</div>
    <div class="top-truck" id="disp-truck">—</div>
  </div>

  <div class="status-hero">
    <div class="pulse-wrap">
      <div class="pulse-dot stopped" id="pulse-dot"></div>
      <div class="status-label stopped" id="status-label">NOT TRACKING</div>
    </div>
    <div class="ping-time" id="ping-time">—</div>
  </div>

  <div class="stats-grid">
    <div class="stat-cell"><div class="stat-val" id="stat-speed">—</div><div class="stat-lbl">Speed (mph)</div></div>
    <div class="stat-cell"><div class="stat-val" id="stat-acc">—</div><div class="stat-lbl">Accuracy (m)</div></div>
    <div class="stat-cell"><div class="stat-val" id="stat-pings">0</div><div class="stat-lbl">Pings Sent</div></div>
    <div class="stat-cell"><div class="stat-val" id="stat-queue">0</div><div class="stat-lbl">Queued</div></div>
  </div>

  <div class="section">
    <div class="section-title">HOS Status</div>
    <div class="hos-grid">
      <button class="hos-btn active" id="hos-driving" onclick="setHos('Driving')">&#x1F69B; Driving</button>
      <button class="hos-btn" id="hos-on-duty" onclick="setHos('On Duty')">&#x1F4BC; On Duty</button>
      <button class="hos-btn" id="hos-sleeper" onclick="setHos('Sleeper')">&#x1F319; Sleeper</button>
      <button class="hos-btn" id="hos-off-duty" onclick="setHos('Off Duty')">&#x1F3E0; Off Duty</button>
    </div>
  </div>

  <div class="section">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Battery Saver Mode</div>
        <div class="toggle-sub">Reduces GPS accuracy, saves battery</div>
      </div>
      <label class="toggle-sw"><input type="checkbox" id="battery-saver" onchange="applyBatterySaver()"><span class="slider"></span></label>
    </div>
  </div>

  <div class="accuracy-row" id="accuracy-row">Waiting for GPS&hellip;</div>
  <button class="btn-main start" id="main-btn" onclick="toggleTracking()">START TRACKING</button>
</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://three-lakes-logistics-api.onrender.com';
const API_TOKEN = 'taiOFL40cCr5V0pH89hUks8jXVPlOkm2WxKvd3f6BoE';
const PING_INTERVAL_MS = 30000;
const MOVE_THRESHOLD_DEG = 0.05 / 69; // ~0.05 miles

let truckId = '', carrierId = '', driverName = '', hosStatus = 'Driving';
let tracking = false, watchId = null, pingTimer = null;
let lastLat = null, lastLng = null;
let pingCount = 0, offlineQueue = [], lastPos = null;

function init() {
  const p = new URLSearchParams(location.search);
  truckId    = p.get('truck')   || '';
  carrierId  = p.get('carrier') || '';
  driverName = p.get('name')    || '';
  if (truckId) showTracker();
  window.addEventListener('online', flushQueue);
}

function setupStart() {
  truckId    = document.getElementById('f-truck').value.trim();
  carrierId  = document.getElementById('f-carrier').value.trim();
  driverName = document.getElementById('f-name').value.trim();
  if (!truckId) { showToast('Enter a Truck ID'); return; }
  showTracker();
}

function showTracker() {
  document.getElementById('setup-screen').style.display = 'none';
  const ts = document.getElementById('tracker-screen');
  ts.style.display = 'flex';
  document.getElementById('disp-truck').textContent = truckId + (carrierId ? ' · ' + carrierId : '');
}

function setHos(status) {
  hosStatus = status;
  const map = {'Driving':'driving','On Duty':'on-duty','Sleeper':'sleeper','Off Duty':'off-duty'};
  document.querySelectorAll('.hos-btn').forEach(b => b.classList.remove('active'));
  const btnId = 'hos-' + (map[status] || 'driving');
  document.getElementById(btnId)?.classList.add('active');
  if (tracking && lastPos) sendHos();
}

async function sendHos() {
  try {
    await fetch(API_BASE + '/api/telemetry/hos', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+API_TOKEN},
      body: JSON.stringify({carrier_id:carrierId||truckId, driver_code:driverName||truckId, duty_status:hosStatus})
    });
  } catch(e) { /* silent */ }
}

function applyBatterySaver() {
  if (tracking) { stopTracking(); startTracking(); }
}

function geoOptions() {
  const saver = document.getElementById('battery-saver')?.checked;
  return {enableHighAccuracy:!saver, timeout:saver?15000:10000, maximumAge:saver?30000:5000};
}

function toggleTracking() {
  if (tracking) stopTracking(); else startTracking();
}

function startTracking() {
  if (!navigator.geolocation) { showToast('GPS not supported'); return; }
  tracking = true; updateUI();
  watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, geoOptions());
  pingTimer = setInterval(tryPing, PING_INTERVAL_MS);
  showToast('Tracking started');
}

function stopTracking() {
  tracking = false;
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(pingTimer); pingTimer = null;
  updateUI(); showToast('Tracking stopped');
}

function onPosition(pos) {
  lastPos = pos;
  const {latitude:lat, longitude:lng, speed, accuracy, heading} = pos.coords;
  const speedMph = speed != null ? speed * 2.23694 : null;
  document.getElementById('stat-speed').textContent = speedMph != null ? Math.round(speedMph) : '—';
  document.getElementById('stat-acc').textContent   = accuracy  != null ? Math.round(accuracy)  : '—';
  document.getElementById('accuracy-row').textContent = accuracy != null ? 'GPS accuracy: ±' + Math.round(accuracy) + 'm' : '';

  if (lastLat != null && lastLng != null) {
    const dlat = Math.abs(lat - lastLat), dlng = Math.abs(lng - lastLng);
    if (Math.sqrt(dlat*dlat + dlng*dlng) > MOVE_THRESHOLD_DEG) {
      sendPing(lat, lng, speedMph, heading, accuracy);
    }
  }
}

function onGeoError(err) {
  document.getElementById('accuracy-row').textContent = 'GPS error: ' + err.message;
}

function tryPing() {
  if (!lastPos) return;
  const {latitude:lat, longitude:lng, speed, accuracy, heading} = lastPos.coords;
  sendPing(lat, lng, speed != null ? speed * 2.23694 : null, heading, accuracy);
}

async function sendPing(lat, lng, speedMph, heading, accuracy) {
  const payload = {
    truck_id:   truckId,
    carrier_id: carrierId || null,
    lat, lng,
    speed_mph:   speedMph != null ? +speedMph.toFixed(1) : null,
    heading_deg: heading  != null ? +heading.toFixed(0)  : null,
    driver_name: driverName || null,
    duty_status: hosStatus,
    accuracy_m:  accuracy  != null ? +accuracy.toFixed(1) : null
  };
  lastLat = lat; lastLng = lng;

  if (!navigator.onLine) { offlineQueue.push(payload); updateStats(); return; }

  try {
    const r = await fetch(API_BASE + '/api/telemetry/native-ping', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_TOKEN},
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      pingCount++;
      document.getElementById('ping-time').textContent = 'Last ping: ' + new Date().toLocaleTimeString();
    } else { offlineQueue.push(payload); }
  } catch(e) { offlineQueue.push(payload); }
  updateStats();
}

async function flushQueue() {
  if (!offlineQueue.length) return;
  const toSend = [...offlineQueue]; offlineQueue = []; updateStats();
  for (const payload of toSend) {
    try {
      const r = await fetch(API_BASE + '/api/telemetry/native-ping', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_TOKEN},
        body: JSON.stringify(payload)
      });
      if (r.ok) pingCount++; else offlineQueue.push(payload);
    } catch(e) { offlineQueue.push(payload); }
  }
  updateStats();
  showToast('Synced ' + toSend.length + ' queued ping' + (toSend.length !== 1 ? 's' : ''));
}

function updateStats() {
  document.getElementById('stat-pings').textContent = pingCount;
  document.getElementById('stat-queue').textContent = offlineQueue.length;
}

function updateUI() {
  const dot = document.getElementById('pulse-dot');
  const lbl = document.getElementById('status-label');
  const btn = document.getElementById('main-btn');
  if (tracking) {
    dot.className = 'pulse-dot active';
    lbl.className = 'status-label active'; lbl.textContent = 'TRACKING LIVE';
    btn.className = 'btn-main stop';       btn.textContent = 'STOP TRACKING';
  } else {
    dot.className = 'pulse-dot stopped';
    lbl.className = 'status-label stopped'; lbl.textContent = 'NOT TRACKING';
    btn.className = 'btn-main start';        btn.textContent = 'START TRACKING';
    document.getElementById('stat-speed').textContent = '—';
    document.getElementById('ping-time').textContent  = '—';
  }
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
