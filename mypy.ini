[mypy]
# 3 Lakes Logistics — mypy strict configuration
# Catches type errors introduced by rapid AI-generated code
python_version = 3.12
strict = True

# Incremental checking speeds up repeat runs
incremental = True
cache_dir = .mypy_cache

# Report errors clearly
show_error_codes = True
show_column_numbers = True
pretty = True

# Don't fail on missing stubs for third-party libs
ignore_missing_imports = True

# Pydantic models use dynamic types — relax for model files
[mypy-app.*.models]
disallow_untyped_defs = False

# Supabase client has no type stubs
[mypy-supabase.*]
ignore_missing_imports = True

[mypy-stripe.*]
ignore_missing_imports = True

[mypy-twilio.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-sendgrid.*]
ignore_missing_imports = True

[mypy-postmarker.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-PyPDF2.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True
