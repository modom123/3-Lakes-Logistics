// ─────────────────────────────────────────────────────────────────────────────
// Voiceover controller — fires speech lines as the timeline crosses thresholds.
// Cancels on pause / scrub backwards.
// ─────────────────────────────────────────────────────────────────────────────
function Voiceover({ enabled, rateOffset = 0, pitchOffset = 0 }) {
  const { time, playing } = useTimeline();
  const firedRef = React.useRef(new Set());
  const lastTimeRef = React.useRef(0);

  // Pick the most natural-sounding English voice available
  const voiceRef = React.useRef(null);
  React.useEffect(() => {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      // Score every voice; higher = better. We prefer named neural / natural
      // voices and en-US over en-GB. Default-flag (often a phone-quality voice)
      // is downweighted unless it's a known good one.
      const score = (v) => {
        const n = (v.name || '').toLowerCase();
        let s = 0;
        if (/(neural|natural|online|premium|enhanced|wavenet|studio)/.test(n)) s += 100;
        if (/(guy|davis|brian|christopher|eric|tony|jason|matthew|adam)/.test(n)) s += 50;  // male announcer voices
        if (/(aria|jenny|emma|olivia|samantha)/.test(n)) s += 35; // strong female voices
        if (/google\s*us\s*english/.test(n)) s += 60;
        if (/microsoft/.test(n)) s += 25;
        if (v.lang && v.lang.startsWith('en-US')) s += 20;
        else if (v.lang && v.lang.startsWith('en')) s += 8;
        if (/(zira|hazel|cortana|david)/.test(n)) s -= 25; // older robotic SAPI voices
        return s;
      };

      const sorted = [...voices].sort((a, b) => score(b) - score(a));
      voiceRef.current = sorted[0] || voices[0];
      // For debugging: window.__pickedVoice = voiceRef.current;
    };
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
  }, []);

  // Cancel speech on disable / pause / scrub backward
  React.useEffect(() => {
    if (!enabled) {
      try { window.speechSynthesis.cancel(); } catch {}
      firedRef.current.clear();
      return;
    }
    if (!playing) {
      try { window.speechSynthesis.cancel(); } catch {}
    }
  }, [enabled, playing]);

  React.useEffect(() => {
    // If user scrubbed back, reset fired set for lines after the new time
    if (time < lastTimeRef.current - 0.3) {
      const stillFired = new Set();
      firedRef.current.forEach(idx => {
        if (SCRIPT[idx].t < time) stillFired.add(idx);
      });
      firedRef.current = stillFired;
      try { window.speechSynthesis.cancel(); } catch {}
    }
    lastTimeRef.current = time;

    if (!enabled || !playing) return;
    if (!('speechSynthesis' in window)) return;

    SCRIPT.forEach((line, i) => {
      if (firedRef.current.has(i)) return;
      if (time >= line.t && time < line.t + 0.5) {
        firedRef.current.add(i);
        const u = new SpeechSynthesisUtterance(line.text);
        if (voiceRef.current) u.voice = voiceRef.current;
        u.rate = clamp((line.rate ?? 0.95) + rateOffset, 0.5, 1.6);
        u.pitch = clamp((line.pitch ?? 1.0) + pitchOffset, 0.5, 1.6);
        u.volume = 1.0;
        window.speechSynthesis.speak(u);
      }
    });
  }, [time, enabled, playing]);

  return null;
}

// Cut flash between scenes
function CutFlash({ at, duration = 0.18, color = '#fff' }) {
  const time = useTime();
  const d = time - at;
  if (d < 0 || d > duration) return null;
  const opacity = 1 - (d / duration);
  return <div style={{ position:'absolute', inset:0, background: color, opacity, mixBlendMode:'screen', pointerEvents:'none' }}/>;
}

// Word-by-word kinetic text
function KineticLine({ words, startDelay = 0, gap = 0.08, size = 200, weight = 700, color = '#F5F8FB',
                       x = 'center', y = 'center', accentIdx = -1, accentColor = '#34D399' }) {
  const sp = useSprite();
  const t = sp.localTime;
  return (
    <div style={{
      position:'absolute',
      left: x === 'center' ? '50%' : x,
      top:  y === 'center' ? '50%' : y,
      transform: `translate(${x === 'center' ? '-50%' : '0'}, ${y === 'center' ? '-50%' : '0'})`,
      display:'flex', flexWrap:'wrap', gap: size * 0.12,
      fontFamily:"'Space Grotesk',sans-serif",
      fontSize: size, fontWeight: weight, lineHeight: 0.9,
      letterSpacing:'-0.04em',
      color, textWrap:'balance',
      maxWidth: 1700,
    }}>
      {words.map((w, i) => {
        const local = clamp((t - startDelay - i * gap) / 0.32, 0, 1);
        const e = Easing.easeOutBack(local);
        return (
          <span key={i} style={{
            display:'inline-block',
            transform: `translateY(${(1 - e) * 30}px) scale(${0.85 + 0.15 * e})`,
            opacity: local,
            color: i === accentIdx ? accentColor : color,
          }}>{w}</span>
        );
      })}
    </div>
  );
}

// Big slamming number

  const scale = 0.7 + 0.3 * e;
  const opacity = clamp(t / 0.25, 0, 1);
  const exit = clamp((t - (sp.duration - 0.35)) / 0.35, 0, 1);
  const exitScale = 1 + 0.1 * exit;
  const exitOpacity = 1 - exit;

  return (
    <div style={{
      position:'absolute', inset:0,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      opacity: opacity * exitOpacity,
      transform: `scale(${scale * exitScale})`,
    }}>
      <div style={{

        fontSize: 30, letterSpacing:'0.3em',
        color: '#8BD0F8', textTransform:'uppercase',
        marginBottom: 30,

        letterSpacing:'-0.06em',

        marginTop: 24, letterSpacing:'-0.01em',

    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// SFX cue dispatcher — fires whooshes / hits at scene boundaries
// ─────────────────────────────────────────────────────────────────────────────
const SFX_CUES = [
  { t: 0.6,  kind: 'whoosh' },     // open
  { t: 2.8,  kind: 'hit'    },     // 30%
  { t: 5.9,  kind: 'hit'    },     // 14 hrs
  { t: 8.9,  kind: 'hit'    },     // $400
  { t: 12.4, kind: 'whoosh' },     // Until now
  { t: 14.5, kind: 'swell'  },     // logo reveal
  { t: 17.4, kind: 'whoosh' },     // feature reel
  { t: 19.5, kind: 'whoosh' },
  { t: 21.5, kind: 'whoosh' },
  { t: 23.5, kind: 'whoosh' },
  { t: 25.6, kind: 'swell'  },     // platform
  { t: 29.5, kind: 'whoosh' },
  { t: 33.95,kind: 'hit'    },     // offer slam
  { t: 41.5, kind: 'whoosh' },
];
function SfxCues({ engineRef, enabled }) {
  const { time, playing } = useTimeline();
  const firedRef = React.useRef(new Set());
  const lastTimeRef = React.useRef(0);

  React.useEffect(() => {
    // Reset on scrub back
    if (time < lastTimeRef.current - 0.3) {
      const still = new Set();
      firedRef.current.forEach(i => { if (SFX_CUES[i].t < time) still.add(i); });
      firedRef.current = still;
    }
    lastTimeRef.current = time;

    if (!enabled || !playing || !engineRef.current) return;
    SFX_CUES.forEach((cue, i) => {
      if (firedRef.current.has(i)) return;
      if (time >= cue.t && time < cue.t + 0.3) {
        firedRef.current.add(i);
        if (cue.kind === 'whoosh') engineRef.current.whoosh();
        else if (cue.kind === 'hit') engineRef.current.hit();
        else if (cue.kind === 'swell') engineRef.current.swell(1.6);
      }
    });
  }, [time, playing, enabled, engineRef]);

  return null;
}

function App() {
  const [audioOn, setAudioOn] = React.useState(false);
  const [armed, setArmed] = React.useState(false);
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const engineRef = React.useRef(null);   // used only for SFX (whoosh/hit/swell)
  const ytPlayerRef = React.useRef(null);
  const ytReadyRef = React.useRef(false);

  // ── Load the YouTube IFrame Player API once ──
  React.useEffect(() => {
    const buildPlayer = () => {
      if (ytPlayerRef.current) return;
      ytPlayerRef.current = new window.YT.Player('yt-player', {
        videoId: t.trackId,
        playerVars: {
          controls: 0, autoplay: 0, modestbranding: 1, rel: 0,
          playsinline: 1, disablekb: 1, fs: 0, iv_load_policy: 3,
        },
        events: {
          onReady: () => {
            ytReadyRef.current = true;
            try { ytPlayerRef.current.setVolume(t.musicVolume); } catch {}
          },
        },
      });
    };
    if (window.YT && window.YT.Player) {
      buildPlayer();
    } else {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => {
        if (prev) try { prev(); } catch {}
        buildPlayer();
      };
      if (!document.getElementById('yt-iframe-api')) {
        const s = document.createElement('script');
        s.id = 'yt-iframe-api';
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(s);
      }
    }
  }, []);  // eslint-disable-line

  const enable = (withSound) => {
    if (withSound) {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      } catch {}
      // SFX engine — start with music style 'off' so only whoosh/hit/swell fire
      if (!engineRef.current) engineRef.current = window.AudioEngine.create();
      engineRef.current.setStyle('off');
      engineRef.current.start();
      engineRef.current.setMusicGain(0);
      // YouTube track
      try {
        if (ytPlayerRef.current && ytReadyRef.current) {
          ytPlayerRef.current.seekTo(t.musicStartOffset || 0, true);
          ytPlayerRef.current.setVolume(t.musicVolume);
          ytPlayerRef.current.playVideo();
        } else if (ytPlayerRef.current) {
          // Player not ready yet — schedule play on ready
          const wait = setInterval(() => {
            if (ytReadyRef.current) {
              clearInterval(wait);
              ytPlayerRef.current.seekTo(t.musicStartOffset || 0, true);
              ytPlayerRef.current.setVolume(t.musicVolume);
              ytPlayerRef.current.playVideo();
            }
          }, 80);
        }
      } catch {}
      setAudioOn(true);
    }
    setArmed(true);
    try { localStorage.setItem('3l-commercial:t', '0'); } catch {}
  };

  // ── Live wire tweaks ──
  React.useEffect(() => {
    if (!audioOn) return;
    try { ytPlayerRef.current && ytPlayerRef.current.setVolume(t.musicVolume); } catch {}
  }, [t.musicVolume, audioOn]);

  React.useEffect(() => {
    if (!audioOn) return;
    try {
      ytPlayerRef.current && ytPlayerRef.current.seekTo(t.musicStartOffset || 0, true);
    } catch {}
  }, [t.musicStartOffset, audioOn]);

  return (
    <>
      {/* Hidden YouTube player — audio source. Off-screen but kept renderable. */}
      <div style={{
        position:'fixed', left:-9999, top:-9999, width:200, height:120, opacity:0, pointerEvents:'none',
      }}>
        <div id="yt-player"></div>
      </div>

      <Stage width={1920} height={1080} duration={45} background="#000" persistKey="3l-commercial-v2" loop={false} autoplay={true}>
        <Commercial
          audioOn={audioOn}
          voiceOn={t.voiceOn}
          sfxOn={t.sfxOn}
          voiceRateOffset={t.voiceRateOffset}
          voicePitchOffset={t.voicePitchOffset}
          engineRef={engineRef}
        />
        <PersistentChrome/>
      </Stage>

      {/* Tweaks panel — visible when the user toggles Tweaks on from the toolbar */}
      {armed && (
        <TweaksPanel title="Commercial Tweaks">
          <TweakSection label="Music · YouTube track"/>
          <TweakSlider
            label="Volume"
            value={t.musicVolume}
            min={0} max={100} step={1} unit="%"
            onChange={(v) => setTweak('musicVolume', v)}
          />
          <TweakSlider
            label="Track start (s)"
            value={t.musicStartOffset}
            min={0} max={180} step={1} unit="s"
            onChange={(v) => setTweak('musicStartOffset', v)}
          />
          <TweakSection label="Voiceover"/>
          <TweakToggle
            label="Voice enabled"
            value={t.voiceOn}
            onChange={(v) => setTweak('voiceOn', v)}
          />
          <TweakSlider
            label="Speed offset"
            value={t.voiceRateOffset}
            min={-0.3} max={0.3} step={0.02}
            onChange={(v) => setTweak('voiceRateOffset', Math.round(v * 100) / 100)}
          />
          <TweakSlider
            label="Pitch offset"
            value={t.voicePitchOffset}
            min={-0.3} max={0.3} step={0.02}
            onChange={(v) => setTweak('voicePitchOffset', Math.round(v * 100) / 100)}
          />
          <TweakSection label="Sound effects"/>
          <TweakToggle
            label="SFX (whoosh / hits)"
            value={t.sfxOn}
            onChange={(v) => setTweak('sfxOn', v)}
          />
        </TweaksPanel>
      )}

      {!armed && (
        <div style={{
          position:'fixed', inset:0,
          background:'rgba(0,0,0,0.78)', backdropFilter:'blur(8px)',
          display:'flex', alignItems:'center', justifyContent:'center',
          zIndex: 100,
        }}>
          <div style={{
            background:'linear-gradient(160deg, #061629 0%, #0B2545 100%)',
            border:'1px solid rgba(143,200,243,0.2)',
            borderRadius: 24,
            padding: '56px 64px',
            color:'#F5F8FB', maxWidth: 620, textAlign:'center',
            fontFamily:"'Space Grotesk',sans-serif",
            boxShadow:'0 40px 120px rgba(79,179,242,0.25)',
          }}>
            <div style={{
              fontFamily:"'JetBrains Mono',monospace",
              fontSize: 14, letterSpacing:'0.2em', textTransform:'uppercase',
              color:'#34D399',
              display:'inline-flex', alignItems:'center', gap: 10, marginBottom: 22,
            }}>
              <span style={{width:8, height:8, borderRadius:'50%', background:'#34D399', boxShadow:'0 0 0 4px rgba(52,211,153,0.25)'}}/>
              45-second commercial
            </div>
            <div style={{ fontSize: 56, fontWeight:700, lineHeight: 1.0, letterSpacing:'-0.025em', marginBottom: 18 }}>
              Automated<br/>American Trucking.
            </div>
            <div style={{ fontSize: 18, color:'rgba(245,248,251,0.7)', marginBottom: 36, lineHeight: 1.5 }}>
              Best with sound. Voiceover over your YouTube backing track.
            </div>
            <div style={{display:'flex', gap: 14, justifyContent:'center'}}>
              <button onClick={() => enable(true)} style={{
                background:'#34D399', color:'#0B2545', border:'none', borderRadius: 999,
                padding:'18px 36px', fontFamily:"'Space Grotesk',sans-serif",
                fontSize: 18, fontWeight: 600, cursor:'pointer',
                boxShadow:'0 10px 30px rgba(52,211,153,0.35)',
              }}>▶ Play with sound</button>
              <button onClick={() => enable(false)} style={{
                background:'transparent', color:'rgba(245,248,251,0.8)', border:'1px solid rgba(245,248,251,0.25)',
                borderRadius: 999, padding:'18px 28px', fontFamily:"'Space Grotesk',sans-serif",
                fontSize: 16, fontWeight: 500, cursor:'pointer',
              }}>Play muted</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
