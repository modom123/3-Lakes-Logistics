<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07090f" />
  <title>3 Lakes Driver — Login</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #07090f;
      --surface:    #0d1220;
      --card:       #121c2e;
      --border:     #1c2d45;
      --border-2:   #263552;
      --accent:     #3b82f6;
      --accent-dim: rgba(59,130,246,.12);
      --green:      #10b981;
      --red:        #ef4444;
      --text:       #eef2ff;
      --text-2:     #94a3b8;
      --muted:      #4b6382;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; }
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; position:relative; overflow:hidden; }
    body::before { content:''; position:fixed; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle,rgba(59,130,246,.07) 0%,transparent 70%); top:-200px; left:-200px; pointer-events:none; z-index:0; }
    body::after  { content:''; position:fixed; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 70%); bottom:-100px; right:-100px; pointer-events:none; z-index:0; }
    .login-container { width:100%; max-width:400px; padding:24px; position:relative; z-index:1; }
    .login-header { text-align:center; margin-bottom:32px; }
    .logo-wrap { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; }
    .logo-icon { width:52px; height:52px; background:linear-gradient(135deg,#3b82f6,#2563eb); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 8px 24px rgba(59,130,246,.3); }
    .logo { font-size:26px; font-weight:800; letter-spacing:-.5px; }
    .logo span { background:linear-gradient(135deg,#60a5fa,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .tagline { font-size:14px; color:var(--text-2); font-weight:500; letter-spacing:.2px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px; box-shadow:0 4px 40px rgba(0,0,0,.5),0 1px 0 var(--border-2) inset; }
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .form-input { width:100%; padding:14px 16px; font-size:16px; font-weight:500; background:var(--card); border:1px solid var(--border); border-radius:12px; color:var(--text); font-family:'Inter',sans-serif; outline:none; transition:border-color .2s,box-shadow .2s; }
    .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .form-input::placeholder { color:var(--muted); }
    .pin-input { letter-spacing:10px; text-align:center; font-size:24px; font-weight:800; }
    .form-hint { font-size:11px; color:var(--muted); margin-top:5px; font-weight:500; }
    .btn-login { width:100%; padding:15px; margin-top:8px; font-size:16px; font-weight:700; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:none; border-radius:13px; cursor:pointer; transition:opacity .15s,transform .1s; box-shadow:0 4px 16px rgba(59,130,246,.4); font-family:'Inter',sans-serif; }
    .btn-login:active { opacity:.9; transform:scale(.99); }
    .btn-login:disabled { opacity:.5; cursor:not-allowed; }
    .error { display:none; padding:12px 14px; margin-bottom:16px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.25); border-radius:10px; color:#f87171; font-size:13px; font-weight:500; }
    .error.show { display:block; }
    .loading { display:none; text-align:center; font-size:14px; color:var(--text-2); padding:8px 0; font-weight:500; }
    .loading.show { display:block; }
    .spinner { display:inline-block; width:15px; height:15px; border:2px solid var(--accent); border-top-color:transparent; border-radius:50%; animation:spin .6s linear infinite; margin-right:8px; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .contact-hint { margin-top:20px; text-align:center; font-size:12px; color:var(--muted); font-weight:500; line-height:1.7; }
    .contact-hint a { color:var(--accent); text-decoration:none; font-weight:600; }
  </style>
  <script src="../shared/config.js"></script>
<script src="../shared/tk.js"></script>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo-wrap">
      <div class="logo-icon">🚛</div>
      <div class="logo"><span>3 Lakes</span> Driver</div>
    </div>
    <div class="tagline">Mobile Dispatch & Earnings Portal</div>
  </div>

  <div class="card">
    <form id="login-form" onsubmit="handleLogin(event)">
      <div id="error" class="error"></div>
      <div id="loading" class="loading">
        <div class="spinner"></div> Signing you in...
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input
          id="phone"
          type="tel"
          class="form-input"
          placeholder="(312) 555-0100"
          inputmode="tel"
          autocomplete="tel"
          required
        />
        <div class="form-hint">10-digit US number</div>
      </div>

      <div class="form-group">
        <label class="form-label">4-Digit PIN</label>
        <input
          id="pin"
          type="password"
          class="form-input pin-input"
          placeholder="••••"
          inputmode="numeric"
          maxlength="4"
          minlength="4"
          required
        />
      </div>

      <button id="login-btn" type="submit" class="btn-login">Sign In →</button>
    </form>
  </div>

  <div class="contact-hint">
    No account? Contact your dispatcher to get set up.<br>
    <a href="mailto:info@3lakeslogistics.com" style="color:#3b82f6">info@3lakeslogistics.com</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// Initialize Supabase from shared config (loaded by ../shared/config.js)
var _cfg = window.__3LL_CONFIG || {};
var sb = null;
if (window.supabase && _cfg.SUPABASE_URL && _cfg.SUPABASE_KEY) {
  sb = window.supabase.createClient(_cfg.SUPABASE_URL, _cfg.SUPABASE_KEY);
}

async function handleLogin(event) {
  event.preventDefault();

  const phone = document.getElementById('phone').value.trim();
  const pin   = document.getElementById('pin').value.trim();
  const errorEl   = document.getElementById('error');
  const loadingEl = document.getElementById('loading');
  const btnEl     = document.getElementById('login-btn');

  errorEl.classList.remove('show');

  const digits = phone.replace(/\D/g, '');
  if (digits.length < 10) {
    errorEl.textContent = 'Please enter a valid 10-digit phone number.';
    errorEl.classList.add('show');
    return;
  }
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    errorEl.textContent = 'PIN must be exactly 4 digits.';
    errorEl.classList.add('show');
    return;
  }

  loadingEl.classList.add('show');
  btnEl.disabled = true;

  // Real Supabase lookup
  if (!sb) {
    errorEl.textContent = 'No driver account found. Contact your dispatcher.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false;
    return;
  }

  try {
    const normalizedPhone = '+1' + digits;

    // Use SECURITY DEFINER RPC — validates phone+pin server-side, bypasses RLS
    const { data, error } = await sb.rpc('driver_login', {
      p_phone: normalizedPhone,
      p_pin:   pin
    });

    if (error || !data) {
      errorEl.textContent = 'Incorrect phone or PIN. Contact your dispatcher.';
      errorEl.classList.add('show');
      loadingEl.classList.remove('show');
      btnEl.disabled = false;
      return;
    }

    const driverCode = data.driver_code || data.id;
    const driverName = [data.first_name, data.last_name].filter(Boolean).join(' ') || data.name || driverCode;

    localStorage.setItem('3ll_token',       'sb-' + driverCode);
    localStorage.setItem('3ll_driver_id',   String(data.id));
    localStorage.setItem('3ll_driver_name', driverName);
    localStorage.setItem('3ll_phone',       normalizedPhone);
    localStorage.setItem('3ll_expires_at',  new Date(Date.now() + 86400000 * 30).toISOString());
    localStorage.setItem('3ll_driver_code', driverCode);
    if (data.carrier_id) localStorage.setItem('3ll_carrier_id', String(data.carrier_id));
    if (data.truck_number) localStorage.setItem('3ll_truck', data.truck_number);
    window.location.href = './index.html';

  } catch (err) {
    errorEl.textContent = 'Connection error — check your internet and try again.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false;
  }
}


document.getElementById('pin').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
});

document.getElementById('phone').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '');
  let f = d;
  if (d.length >= 6)      f = '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6,10);
  else if (d.length >= 3) f = '(' + d.slice(0,3) + ') ' + d.slice(3);
  e.target.value = f.substring(0, 14);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
