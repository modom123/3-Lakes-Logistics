<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1e" />
  <title>3 Lakes Driver — Login</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:     #0a0f1e;
      --surface: #111827;
      --card:   #1a2235;
      --border: #2d3748;
      --accent: #3b82f6;
      --green:  #22c55e;
      --red:    #ef4444;
      --text:   #f1f5f9;
      --muted:  #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    .login-container { width: 100%; max-width: 400px; padding: 24px; }
    .login-header { text-align: center; margin-bottom: 36px; }
    .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .logo-icon { width: 48px; height: 48px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .logo { font-size: 26px; font-weight: 800; color: var(--text); }
    .logo span { color: var(--accent); }
    .tagline { font-size: 14px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 13px 16px; font-size: 16px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); }
    .form-input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    .pin-input { letter-spacing: 8px; text-align: center; font-size: 24px; font-weight: 700; }
    .form-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .btn-login { width: 100%; padding: 15px; margin-top: 8px; font-size: 16px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: 12px; cursor: pointer; transition: background .15s; }
    .btn-login:active { background: #2563eb; }
    .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }
    .error { display: none; padding: 12px 14px; margin-bottom: 16px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: var(--red); font-size: 13px; }
    .error.show { display: block; }
    .loading { display: none; text-align: center; font-size: 14px; color: var(--muted); padding: 8px 0; }
    .loading.show { display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .contact-hint { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
  <script src="../shared/config.js"></script>
<script src="../shared/tk.js"></script>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo-wrap">
      <div class="logo-icon">🚛</div>
      <div class="logo"><span>3 Lakes</span> Driver</div>
    </div>
    <div class="tagline">Mobile Dispatch & Earnings Portal</div>
  </div>

  <div class="card">
    <form id="login-form" onsubmit="handleLogin(event)">
      <div id="error" class="error"></div>
      <div id="loading" class="loading">
        <div class="spinner"></div> Signing you in...
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input
          id="phone"
          type="tel"
          class="form-input"
          placeholder="(312) 555-0100"
          inputmode="tel"
          autocomplete="tel"
          required
        />
        <div class="form-hint">10-digit US number</div>
      </div>

      <div class="form-group">
        <label class="form-label">4-Digit PIN</label>
        <input
          id="pin"
          type="password"
          class="form-input pin-input"
          placeholder="••••"
          inputmode="numeric"
          maxlength="4"
          minlength="4"
          required
        />
      </div>

      <button id="login-btn" type="submit" class="btn-login">Sign In →</button>
    </form>
  </div>

  <div class="contact-hint">
    No account? Contact your dispatcher to get set up.<br>
    <a href="mailto:info@3lakeslogistics.com" style="color:#3b82f6">info@3lakeslogistics.com</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// Initialize Supabase from shared config (loaded by ../shared/config.js)
var _cfg = window.__3LL_CONFIG || {};
var sb = null;
if (window.supabase && _cfg.SUPABASE_URL && _cfg.SUPABASE_KEY) {
  sb = window.supabase.createClient(_cfg.SUPABASE_URL, _cfg.SUPABASE_KEY);
}

async function handleLogin(event) {
  event.preventDefault();

  const phone = document.getElementById('phone').value.trim();
  const pin   = document.getElementById('pin').value.trim();
  const errorEl   = document.getElementById('error');
  const loadingEl = document.getElementById('loading');
  const btnEl     = document.getElementById('login-btn');

  errorEl.classList.remove('show');

  const digits = phone.replace(/\D/g, '');
  if (digits.length < 10) {
    errorEl.textContent = 'Please enter a valid 10-digit phone number.';
    errorEl.classList.add('show');
    return;
  }
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    errorEl.textContent = 'PIN must be exactly 4 digits.';
    errorEl.classList.add('show');
    return;
  }

  loadingEl.classList.add('show');
  btnEl.disabled = true;

  // Real Supabase lookup
  if (!sb) {
    errorEl.textContent = 'No driver account found. Contact your dispatcher.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false;
    return;
  }

  try {
    const normalizedPhone = '+1' + digits;

    // Use SECURITY DEFINER RPC — validates phone+pin server-side, bypasses RLS
    const { data, error } = await sb.rpc('driver_login', {
      p_phone: normalizedPhone,
      p_pin:   pin
    });

    if (error || !data) {
      errorEl.textContent = 'Incorrect phone or PIN. Contact your dispatcher.';
      errorEl.classList.add('show');
      loadingEl.classList.remove('show');
      btnEl.disabled = false;
      return;
    }

    const driverCode = data.driver_code || data.id;
    const driverName = [data.first_name, data.last_name].filter(Boolean).join(' ') || data.name || driverCode;

    // Store Supabase identity for real-time subscriptions
    localStorage.setItem('3ll_driver_id',   String(data.id));
    localStorage.setItem('3ll_driver_name', driverName);
    localStorage.setItem('3ll_phone',       normalizedPhone);
    localStorage.setItem('3ll_expires_at',  new Date(Date.now() + 86400000 * 30).toISOString());
    localStorage.setItem('3ll_driver_code', driverCode);
    if (data.carrier_id) localStorage.setItem('3ll_carrier_id', String(data.carrier_id));
    if (data.truck_number) localStorage.setItem('3ll_truck', data.truck_number);

    // Also get a proper API session token for protected REST endpoints
    const API_BASE = 'https://three-lakes-logistics-api.onrender.com';
    try {
      const apiRes = await fetch(API_BASE + '/api/driver-auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: digits, pin }),
      });
      if (apiRes.ok) {
        const apiData = await apiRes.json();
        localStorage.setItem('3ll_token',     apiData.token);
        localStorage.setItem('3ll_api_token', apiData.token);
        if (apiData.carrier_id) localStorage.setItem('3ll_carrier_id', String(apiData.carrier_id));
      } else {
        // API login failed — use a fallback token so the app still loads
        localStorage.setItem('3ll_token', 'sb-' + driverCode);
      }
    } catch {
      localStorage.setItem('3ll_token', 'sb-' + driverCode);
    }
    window.location.href = './index.html';

  } catch (err) {
    errorEl.textContent = 'Connection error — check your internet and try again.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false;
  }
}


document.getElementById('pin').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
});

document.getElementById('phone').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '');
  let f = d;
  if (d.length >= 6)      f = '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6,10);
  else if (d.length >= 3) f = '(' + d.slice(0,3) + ') ' + d.slice(3);
  e.target.value = f.substring(0, 14);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
