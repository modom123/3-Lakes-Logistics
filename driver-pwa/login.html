<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1e" />
  <title>3 Lakes Driver — Login</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:     #0a0f1e;
      --surface: #111827;
      --card:   #1a2235;
      --border: #2d3748;
      --accent: #3b82f6;
      --green:  #22c55e;
      --red:    #ef4444;
      --text:   #f1f5f9;
      --muted:  #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overscroll-behavior: none; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      /* Use dvh where supported for correct height on mobile browsers */
      min-height: 100dvh;
      padding: env(safe-area-inset-top,16px) 0 env(safe-area-inset-bottom,16px);
    }
    .login-container { width: 100%; max-width: 400px; padding: 24px; }
    .login-header { text-align: center; margin-bottom: 36px; }
    .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .logo-icon { width: 48px; height: 48px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .logo { font-size: 26px; font-weight: 800; color: var(--text); }
    .logo span { color: var(--accent); }
    .tagline { font-size: 14px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 13px 16px; font-size: 16px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); -webkit-appearance: none; appearance: none; }
    .form-input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    /* PIN uses large font — still 16px+ to prevent iOS zoom */
    .pin-input { letter-spacing: 8px; text-align: center; font-size: 24px; font-weight: 700; }
    .form-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .btn-login { width: 100%; padding: 15px; margin-top: 8px; font-size: 16px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: 12px; cursor: pointer; transition: background .15s; }
    .btn-login:active { background: #2563eb; }
    .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }
    .error { display: none; padding: 12px 14px; margin-bottom: 16px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: var(--red); font-size: 13px; }
    .error.show { display: block; }
    .loading { display: none; text-align: center; font-size: 14px; color: var(--muted); padding: 8px 0; }
    .loading.show { display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .contact-hint { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
  <script src="../shared/config.js"></script>
<script src="../shared/tk.js"></script>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo-wrap">
      <div class="logo-icon">🚛</div>
      <div class="logo"><span>3 Lakes</span> Driver</div>
    </div>
    <div class="tagline">Mobile Dispatch & Earnings Portal</div>
  </div>

  <div class="card">
    <form id="login-form" onsubmit="handleSubmit(event)">
      <div id="error" class="error"></div>
      <div id="loading" class="loading">
        <div class="spinner"></div> <span id="loading-text">Signing you in...</span>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input
          id="phone"
          type="tel"
          class="form-input"
          placeholder="(312) 555-0100"
          inputmode="tel"
          autocomplete="tel"
          required
        />
        <div class="form-hint">10-digit US number</div>
      </div>

      <div class="form-group">
        <label id="pin-label" class="form-label">4-Digit PIN</label>
        <input
          id="pin"
          type="password"
          class="form-input pin-input"
          placeholder="••••"
          inputmode="numeric"
          maxlength="4"
          minlength="4"
          required
        />
      </div>

      <div id="confirm-pin-group" class="form-group" style="display:none">
        <label class="form-label">Confirm PIN</label>
        <input
          id="confirm-pin"
          type="password"
          class="form-input pin-input"
          placeholder="••••"
          inputmode="numeric"
          maxlength="4"
          minlength="4"
        />
      </div>

      <button id="login-btn" type="submit" class="btn-login">Sign In →</button>

      <div style="text-align:center;margin-top:14px">
        <button type="button" id="mode-toggle" onclick="toggleMode()"
          style="background:none;border:none;color:#3b82f6;font-size:13px;cursor:pointer;padding:4px;text-decoration:underline">
          First login? Set your PIN →
        </button>
      </div>
    </form>
  </div>

  <div style="margin-top:16px;text-align:center">
    <a href="./login-lf.html" style="display:inline-block;font-size:13px;color:#94a3b8;text-decoration:none;padding:10px 16px;border:1px solid #2d3748;border-radius:10px;">🚗 Light Fleet / Gig Driver? Sign in here</a>
  </div>

  <div class="contact-hint">
    No account? Contact your dispatcher to get set up.<br>
    <a href="mailto:info@3lakeslogistics.com" style="color:#3b82f6">info@3lakeslogistics.com</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

var _cfg = window.__3LL_CONFIG || {};
var sb = null;
if (window.supabase && _cfg.SUPABASE_URL && _cfg.SUPABASE_KEY) {
  sb = window.supabase.createClient(_cfg.SUPABASE_URL, _cfg.SUPABASE_KEY);
}

var mode = 'login'; // 'login' | 'setup'

function toggleMode() {
  mode = mode === 'login' ? 'setup' : 'login';
  var isSetup = mode === 'setup';
  document.getElementById('confirm-pin-group').style.display = isSetup ? '' : 'none';
  document.getElementById('confirm-pin').value = '';
  document.getElementById('pin-label').textContent = isSetup ? 'New 4-Digit PIN' : '4-Digit PIN';
  document.getElementById('pin').placeholder = isSetup ? 'New PIN' : '••••';
  document.getElementById('login-btn').textContent = isSetup ? 'Set PIN & Enter →' : 'Sign In →';
  document.getElementById('mode-toggle').textContent = isSetup ? '← Back to Sign In' : 'First login? Set your PIN →';
  document.getElementById('loading-text').textContent = isSetup ? 'Setting your PIN...' : 'Signing you in...';
  document.getElementById('error').classList.remove('show');
  document.getElementById('pin').value = '';
}

function handleSubmit(event) {
  if (mode === 'setup') handleSetupPin(event);
  else handleLogin(event);
}

function _storeSession(data, normalizedPhone) {
  localStorage.setItem('3ll_token',       data.token || data.api_token || '');
  localStorage.setItem('3ll_api_token',   data.token || data.api_token || '');
  localStorage.setItem('3ll_driver_id',   String(data.driver_id || data.id || ''));
  localStorage.setItem('3ll_driver_name', data.driver_name || data.name || '');
  localStorage.setItem('3ll_phone',       normalizedPhone);
  localStorage.setItem('3ll_expires_at',  data.expires_at || new Date(Date.now() + 86400000 * 30).toISOString());
  localStorage.setItem('3ll_driver_mode', 'truck');
  if (data.carrier_id) localStorage.setItem('3ll_carrier_id', String(data.carrier_id));
  if (data.driver_code) localStorage.setItem('3ll_driver_code', data.driver_code);
  if (data.truck_number) localStorage.setItem('3ll_truck', data.truck_number);
  localStorage.removeItem('3ll_lf_driver_id');
}

async function handleLogin(event) {
  event.preventDefault();

  var phone = document.getElementById('phone').value.trim();
  var pin   = document.getElementById('pin').value.trim();
  var errorEl   = document.getElementById('error');
  var loadingEl = document.getElementById('loading');
  var btnEl     = document.getElementById('login-btn');

  errorEl.classList.remove('show');

  var digits = phone.replace(/\D/g, '');
  if (digits.length < 10) {
    errorEl.textContent = 'Please enter a valid 10-digit phone number.';
    errorEl.classList.add('show'); return;
  }
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    errorEl.textContent = 'PIN must be exactly 4 digits.';
    errorEl.classList.add('show'); return;
  }

  loadingEl.classList.add('show');
  btnEl.disabled = true;

  if (!sb) {
    errorEl.textContent = 'No driver account found. Contact your dispatcher.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false; return;
  }

  try {
    var normalizedPhone = '+1' + digits;

    var rpc = await sb.rpc('driver_login', { p_phone: normalizedPhone, p_pin: pin });
    if (rpc.error || !rpc.data) {
      errorEl.textContent = 'Incorrect phone or PIN. Contact your dispatcher.';
      errorEl.classList.add('show');
      loadingEl.classList.remove('show');
      btnEl.disabled = false; return;
    }

    var driverCode = rpc.data.driver_code || rpc.data.id;
    var driverName = [rpc.data.first_name, rpc.data.last_name].filter(Boolean).join(' ') || driverCode;

    // Persist Supabase identity for realtime subscriptions
    localStorage.setItem('3ll_driver_id',   String(rpc.data.id));
    localStorage.setItem('3ll_driver_name', driverName);
    localStorage.setItem('3ll_phone',       normalizedPhone);
    localStorage.setItem('3ll_expires_at',  new Date(Date.now() + 86400000 * 30).toISOString());
    localStorage.setItem('3ll_driver_code',  driverCode);
    localStorage.setItem('3ll_driver_mode',  'truck');
    if (rpc.data.carrier_id) localStorage.setItem('3ll_carrier_id', String(rpc.data.carrier_id));
    if (rpc.data.truck_number) localStorage.setItem('3ll_truck', rpc.data.truck_number);
    localStorage.removeItem('3ll_lf_driver_id');

    // Also fetch a REST session token for protected endpoints
    var API_BASE = (_cfg.API_BASE || 'https://three-lakes-logistics-api.onrender.com');
    try {
      var apiRes = await fetch(API_BASE + '/api/driver-auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: digits, pin }),
      });
      if (apiRes.ok) {
        var apiData = await apiRes.json();
        localStorage.setItem('3ll_token',     apiData.token);
        localStorage.setItem('3ll_api_token', apiData.token);
        if (apiData.carrier_id) localStorage.setItem('3ll_carrier_id', String(apiData.carrier_id));
      } else {
        localStorage.setItem('3ll_token', 'sb-' + driverCode);
      }
    } catch (_) {
      localStorage.setItem('3ll_token', 'sb-' + driverCode);
    }
    window.location.href = './index.html';

  } catch (err) {
    errorEl.textContent = 'Connection error — check your internet and try again.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false;
  }
}

async function handleSetupPin(event) {
  event.preventDefault();

  var phone      = document.getElementById('phone').value.trim();
  var pin        = document.getElementById('pin').value.trim();
  var confirmPin = document.getElementById('confirm-pin').value.trim();
  var errorEl    = document.getElementById('error');
  var loadingEl  = document.getElementById('loading');
  var btnEl      = document.getElementById('login-btn');

  errorEl.classList.remove('show');

  var digits = phone.replace(/\D/g, '');
  if (digits.length < 10) {
    errorEl.textContent = 'Please enter a valid 10-digit phone number.';
    errorEl.classList.add('show'); return;
  }
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    errorEl.textContent = 'PIN must be exactly 4 digits.';
    errorEl.classList.add('show'); return;
  }
  if (pin !== confirmPin) {
    errorEl.textContent = 'PINs do not match — please try again.';
    errorEl.classList.add('show'); return;
  }

  loadingEl.classList.add('show');
  btnEl.disabled = true;

  try {
    var API_BASE = (_cfg.API_BASE || 'https://three-lakes-logistics-api.onrender.com');
    var res = await fetch(API_BASE + '/api/driver-auth/setup-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: digits, pin }),
    });

    if (!res.ok) {
      var err = await res.json().catch(function(){ return {}; });
      var msg = err.detail || 'Setup failed. Contact your dispatcher.';
      if (msg === 'PIN already set — use the Sign In form') {
        msg = 'You already have a PIN — tap "← Back to Sign In" to log in.';
      }
      errorEl.textContent = msg;
      errorEl.classList.add('show');
      loadingEl.classList.remove('show');
      btnEl.disabled = false; return;
    }

    var data = await res.json();
    _storeSession(data, '+1' + digits);
    window.location.href = './index.html';

  } catch (err) {
    errorEl.textContent = 'Connection error — check your internet and try again.';
    errorEl.classList.add('show');
    loadingEl.classList.remove('show');
    btnEl.disabled = false;
  }
}

document.getElementById('pin').addEventListener('input', function(e) {
  e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
});
document.getElementById('confirm-pin').addEventListener('input', function(e) {
  e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
});
document.getElementById('phone').addEventListener('input', function(e) {
  var d = e.target.value.replace(/\D/g, '');
  var f = d;
  if (d.length >= 6)      f = '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6,10);
  else if (d.length >= 3) f = '(' + d.slice(0,3) + ') ' + d.slice(3);
  e.target.value = f.substring(0, 14);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
