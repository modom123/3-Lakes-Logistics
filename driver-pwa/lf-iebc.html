<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IEBC Light Fleet — Driver Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.41.0/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy:   #0B2545;
    --navy2:  #112d5c;
    --gold:   #C8902A;
    --purple: #7c3aed;
    --purple2:#5b21b6;
    --green:  #10b981;
    --red:    #ef4444;
    --yellow: #f59e0b;
    --gray:   #94a3b8;
    --card:   #0f2a4a;
    --border: rgba(255,255,255,0.08);
    --text:   #e2e8f0;
    --subtext:#94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0B2545 0%, #1a1a4e 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 38px; height: 38px; background: var(--gold);
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 14px;
    color: var(--navy); letter-spacing: -0.5px;
  }
  .header-title { font-size: 17px; font-weight: 700; color: #fff; }
  .header-sub   { font-size: 11px; color: var(--gold); font-weight: 600; letter-spacing: 0.05em; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .division-score {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 14px;
    text-align: center;
  }
  .division-score .score-val { font-size: 20px; font-weight: 800; color: var(--green); }
  .division-score .score-lbl { font-size: 9px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.05em; }
  .last-refresh { font-size: 11px; color: var(--subtext); }

  /* ── KPI bar ── */
  .kpi-bar {
    display: flex; gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .kpi {
    flex: 1; background: rgba(11,37,69,0.9);
    padding: 14px 20px; text-align: center;
  }
  .kpi-val { font-size: 22px; font-weight: 800; color: #fff; }
  .kpi-lbl { font-size: 10px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .kpi-val.green { color: var(--green); }
  .kpi-val.gold  { color: var(--gold); }
  .kpi-val.purple{ color: #a78bfa; }
  .kpi-val.red   { color: var(--red); }

  /* ── Toolbar ── */
  .toolbar {
    padding: 16px 24px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .search-box {
    flex: 1; min-width: 200px;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search-box::placeholder { color: var(--subtext); }
  .search-box:focus { border-color: var(--purple); }
  .filter-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--purple); border-color: var(--purple); color: #fff;
  }
  .sort-select {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .sort-select option { background: #1a2744; }

  /* ── Driver grid ── */
  .drivers-wrap { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }

  /* ── Driver card ── */
  .driver-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .driver-card:hover { border-color: rgba(124,58,237,0.4); }
  .driver-card.expanded { border-color: var(--purple); }

  .driver-summary {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }

  /* Avatar */
  .avatar {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; flex-shrink: 0;
    color: #fff; position: relative;
  }
  .avatar .status-dot {
    position: absolute; bottom: -2px; right: -2px;
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--card);
  }

  /* Driver meta */
  .driver-meta { flex: 1; min-width: 0; }
  .driver-name { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .driver-loc  { font-size: 12px; color: var(--subtext); display: flex; align-items: center; gap: 4px; }

  /* Service pills */
  .service-pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .service-pill {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 20px; letter-spacing: 0.02em;
  }
  .pill-nemt      { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .pill-courier   { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .pill-executive { background: rgba(124,58,237,0.2);  color: #c4b5fd; }
  .pill-gig       { background: rgba(59,130,246,0.15); color: #93c5fd; }

  /* Mini stats */
  .mini-stats { display: flex; gap: 20px; flex-shrink: 0; }
  .mini-stat  { text-align: center; }
  .mini-stat-val { font-size: 16px; font-weight: 800; color: #fff; }
  .mini-stat-lbl { font-size: 10px; color: var(--subtext); }

  /* Acceptance ring */
  .acceptance-ring {
    position: relative; width: 52px; height: 52px; flex-shrink: 0;
  }
  .acceptance-ring svg { transform: rotate(-90deg); }
  .acceptance-ring .ring-val {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #fff;
  }

  /* Status badge */
  .status-badge {
    font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 20px; flex-shrink: 0;
  }
  .badge-active    { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
  .badge-inactive  { background: rgba(100,116,139,0.15); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }
  .badge-suspended { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

  /* Chevron */
  .chevron {
    color: var(--subtext); transition: transform 0.25s; flex-shrink: 0;
    font-size: 18px; font-weight: 300;
  }
  .expanded .chevron { transform: rotate(180deg); }

  /* ── Report card dropdown ── */
  .report-card {
    display: none; border-top: 1px solid var(--border);
    padding: 0;
  }
  .expanded .report-card { display: block; }

  .rc-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .rc-tab {
    padding: 11px 18px; font-size: 12px; font-weight: 600;
    color: var(--subtext); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s; white-space: nowrap;
  }
  .rc-tab.active { color: #fff; border-bottom-color: var(--purple); }
  .rc-tab:hover:not(.active) { color: var(--text); }

  .rc-panel { display: none; padding: 20px; }
  .rc-panel.active { display: block; }

  /* Section header */
  .sec-hdr {
    font-size: 10px; font-weight: 700; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* Info grid — full width rows */
  .info-grid { display: flex; flex-direction: column; gap: 0; margin-bottom: 18px;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .info-item {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .info-item:last-child { border-bottom: none; }
  .info-item:nth-child(even) { background: rgba(255,255,255,0.02); }
  .info-item label { font-size: 11px; color: var(--subtext); text-transform: uppercase;
    letter-spacing: 0.05em; flex-shrink: 0; margin-right: 16px; }
  .info-item span  { font-size: 13px; color: var(--text); font-weight: 500;
    text-align: right; word-break: break-all; }

  /* Metric bars */
  .metric-row { margin-bottom: 14px; }
  .metric-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .metric-name { font-size: 13px; color: var(--text); }
  .metric-val  { font-size: 14px; font-weight: 700; }
  .bar-track {
    height: 7px; background: rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Trip table */
  .trip-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .trip-table th {
    text-align: left; font-size: 10px; font-weight: 600;
    color: var(--subtext); text-transform: uppercase;
    letter-spacing: 0.06em; padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  .trip-table td {
    padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--text); vertical-align: middle;
  }
  .trip-type-badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 20px; display: inline-block;
  }
  .trip-status-badge {
    font-size: 10px; padding: 2px 7px; border-radius: 20px; display: inline-block;
  }
  .st-completed  { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .st-in_progress{ background: rgba(124,58,237,0.2);  color: #c4b5fd; }
  .st-pending    { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .st-cancelled  { background: rgba(239,68,68,0.12); color: #fca5a5; }
  .st-assigned   { background: rgba(59,130,246,0.15); color: #93c5fd; }

  /* Compliance items */
  .compliance-list { display: flex; flex-direction: column; gap: 8px; }
  .compliance-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  }
  .comp-icon { font-size: 18px; flex-shrink: 0; }
  .comp-text { flex: 1; }
  .comp-label { font-size: 13px; color: var(--text); font-weight: 500; }
  .comp-sub   { font-size: 11px; color: var(--subtext); margin-top: 1px; }
  .comp-status { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .comp-ok   { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .comp-warn { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .comp-bad  { background: rgba(239,68,68,0.15); color: #fca5a5; }

  /* Map placeholder / POI */
  .poi-list { display: flex; flex-direction: column; gap: 8px; }
  .poi-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  }
  .poi-rank {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(124,58,237,0.2); color: #c4b5fd;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .poi-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .poi-count{ font-size: 11px; color: var(--subtext); margin-top: 1px; }
  .poi-bar  { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .poi-fill { height: 100%; background: var(--purple); border-radius: 10px; }

  /* Grade badge */
  .grade-circle {
    width: 70px; height: 70px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; flex-shrink: 0;
    font-weight: 800; border: 3px solid;
  }
  .grade-circle .grade-letter { font-size: 24px; line-height: 1; }
  .grade-circle .grade-sub { font-size: 9px; color: var(--subtext); }
  .grade-A { border-color: var(--green); color: var(--green); }
  .grade-B { border-color: #60a5fa;       color: #60a5fa; }
  .grade-C { border-color: var(--yellow); color: var(--yellow); }
  .grade-D { border-color: #f97316;       color: #f97316; }
  .grade-F { border-color: var(--red);    color: var(--red); }

  .grade-panel { display: flex; align-items: center; gap: 20px; margin-bottom: 20px;
    padding: 16px; background: rgba(255,255,255,0.03); border-radius: 12px;
    border: 1px solid var(--border); }
  .grade-detail h3 { font-size: 16px; font-weight: 700; color: #fff; }
  .grade-detail p  { font-size: 12px; color: var(--subtext); margin-top: 4px; }

  /* Empty state */
  .empty { text-align: center; padding: 40px 20px; color: var(--subtext); font-size: 13px; }

  /* Loading */
  .loading { text-align: center; padding: 60px; color: var(--subtext); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--purple); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 640px) {
    .mini-stats { gap: 12px; }
    .info-grid  { grid-template-columns: 1fr; }
    .kpi        { padding: 10px 12px; }
    .kpi-val    { font-size: 18px; }
    .toolbar    { padding: 12px 16px; }
    .drivers-wrap { padding: 14px 16px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-brand">
    <div class="header-logo">3LL</div>
    <div>
      <div class="header-title">Light Fleet Command</div>
      <div class="header-sub">IEBC Operations Center</div>
    </div>
  </div>
  <div class="header-right">
    <div class="division-score">
      <div class="score-val" id="divisionScore">—</div>
      <div class="score-lbl">Division Health</div>
    </div>
    <div class="last-refresh" id="lastRefresh">Loading…</div>
  </div>
</div>

<!-- KPI Bar -->
<div class="kpi-bar">
  <div class="kpi"><div class="kpi-val green" id="kpiActive">—</div><div class="kpi-lbl">Active Drivers</div></div>
  <div class="kpi"><div class="kpi-val purple" id="kpiTrips">—</div><div class="kpi-lbl">Trips Today</div></div>
  <div class="kpi"><div class="kpi-val gold" id="kpiRevenue">—</div><div class="kpi-lbl">Est. Revenue Today</div></div>
  <div class="kpi"><div class="kpi-val" id="kpiAcceptance">—</div><div class="kpi-lbl">Avg Acceptance Rate</div></div>
  <div class="kpi"><div class="kpi-val red" id="kpiFlags">—</div><div class="kpi-lbl">Compliance Flags</div></div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <input class="search-box" id="searchBox" type="text" placeholder="Search driver name, location, vehicle…" />
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="active">Active</button>
  <button class="filter-btn" data-filter="nemt">NEMT</button>
  <button class="filter-btn" data-filter="courier">Courier</button>
  <button class="filter-btn" data-filter="executive">Executive</button>
  <button class="filter-btn" data-filter="gig">Gig</button>
  <select class="sort-select" id="sortSelect">
    <option value="name">Sort: Name</option>
    <option value="trips">Sort: Most Trips</option>
    <option value="acceptance">Sort: Acceptance Rate</option>
    <option value="rating">Sort: Rating</option>
  </select>
</div>

<!-- Driver list -->
<div class="drivers-wrap" id="driversWrap">
  <div class="loading"><div class="spinner"></div>Loading light fleet drivers…</div>
</div>

<script>
const SUPABASE_URL = 'https://zngipootstubwvgdmckt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ2lwb290c3R1Ynd2Z2RtY2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMjk3ODUsImV4cCI6MjA4ODcwNTc4NX0.6MXR8q-CKVuiiJaJKuckxABAUQ-siuyP0-KoaLkt33g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allDrivers = [];
let tripsByDriver = {};
let activeFilter = 'all';

const AVATAR_COLORS = [
  '#7c3aed','#1d4ed8','#065f46','#9d174d','#92400e',
  '#1e40af','#6d28d9','#047857','#be123c','#b45309'
];

function avatarColor(name) {
  let h = 0;
  for (const c of (name || 'X')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtCurrency(v) {
  if (v == null) return '—';
  return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function expiry(dateStr) {
  if (!dateStr) return { label: 'Unknown', cls: 'comp-warn' };
  const d = new Date(dateStr);
  const days = Math.ceil((d - Date.now()) / 86400000);
  if (days < 0)  return { label: 'EXPIRED',        cls: 'comp-bad' };
  if (days < 30) return { label: `${days}d left`,  cls: 'comp-warn' };
  return { label: fmtDate(dateStr),                 cls: 'comp-ok' };
}

function grade(pct) {
  if (pct >= 90) return 'A';
  if (pct >= 80) return 'B';
  if (pct >= 70) return 'C';
  if (pct >= 60) return 'D';
  return 'F';
}

function gradeDescription(g) {
  return { A: 'Excellent performance', B: 'Good performance', C: 'Average performance', D: 'Below expectations', F: 'Needs immediate attention' }[g] || '';
}

function barColor(pct) {
  if (pct >= 80) return 'var(--green)';
  if (pct >= 60) return '#60a5fa';
  if (pct >= 40) return 'var(--yellow)';
  return 'var(--red)';
}

function acceptanceRate(driverTrips) {
  const done = driverTrips.filter(t => t.status === 'completed').length;
  const cancelled = driverTrips.filter(t => t.status === 'cancelled').length;
  const total = done + cancelled;
  if (!total) return null;
  return Math.round((done / total) * 100);
}

function topPOI(driverTrips) {
  const counts = {};
  for (const t of driverTrips) {
    const city = (t.pickup_address || '').split(',').pop()?.trim() || '';
    if (city) counts[city] = (counts[city] || 0) + 1;
  }
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);
}

function complianceFlags(driver) {
  const flags = [];
  if (driver.mvr_status === 'flagged')              flags.push({ label: 'MVR Flagged', urgency: 'bad' });
  if (driver.background_check_status === 'flagged') flags.push({ label: 'Background Check Flagged', urgency: 'bad' });
  const licE = expiry(driver.license_expires);
  if (licE.cls !== 'comp-ok') flags.push({ label: 'License Expiry', urgency: licE.cls === 'comp-bad' ? 'bad' : 'warn' });
  const insE = expiry(driver.vehicle_insurance_expires);
  if (insE.cls !== 'comp-ok') flags.push({ label: 'Vehicle Insurance Expiry', urgency: insE.cls === 'comp-bad' ? 'bad' : 'warn' });
  return flags;
}

async function loadData() {
  const [{ data: drivers }, { data: trips }] = await Promise.all([
    sb.from('light_vehicle_drivers').select('*').order('name'),
    sb.from('light_vehicle_trips').select('*').order('created_at', { ascending: false })
  ]);

  allDrivers = drivers || [];
  tripsByDriver = {};
  for (const t of (trips || [])) {
    if (!tripsByDriver[t.driver_id]) tripsByDriver[t.driver_id] = [];
    tripsByDriver[t.driver_id].push(t);
  }

  updateKPIs(trips || []);
  renderDrivers();
  document.getElementById('lastRefresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function updateKPIs(allTrips) {
  const activeCount = allDrivers.filter(d => d.status === 'active').length;
  document.getElementById('kpiActive').textContent = activeCount;

  const today = new Date().toISOString().slice(0, 10);
  const todayTrips = allTrips.filter(t => (t.created_at || '').startsWith(today));
  document.getElementById('kpiTrips').textContent = todayTrips.length;

  const rev = todayTrips.reduce((s, t) => s + (t.rate_total || 0), 0);
  document.getElementById('kpiRevenue').textContent = '$' + rev.toLocaleString('en-US', { minimumFractionDigits: 0 });

  // Avg acceptance
  let rates = [];
  for (const d of allDrivers) {
    const r = acceptanceRate(tripsByDriver[d.id] || []);
    if (r !== null) rates.push(r);
  }
  const avgAcc = rates.length ? Math.round(rates.reduce((a, b) => a + b, 0) / rates.length) : null;
  const kpiAcc = document.getElementById('kpiAcceptance');
  kpiAcc.textContent = avgAcc !== null ? avgAcc + '%' : '—';
  if (avgAcc >= 80) kpiAcc.className = 'kpi-val green';
  else if (avgAcc >= 60) kpiAcc.className = 'kpi-val gold';
  else kpiAcc.className = 'kpi-val red';

  // Compliance flags
  let flagCount = 0;
  for (const d of allDrivers) flagCount += complianceFlags(d).length;
  document.getElementById('kpiFlags').textContent = flagCount;

  // Division score (heuristic)
  const base = avgAcc !== null ? avgAcc : 70;
  const penalty = Math.min(flagCount * 5, 30);
  const score = Math.max(0, Math.min(100, Math.round(base - penalty + (activeCount > 5 ? 5 : 0))));
  document.getElementById('divisionScore').textContent = score;
  document.getElementById('divisionScore').style.color = score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--yellow)' : 'var(--red)';
}

function filterAndSort(drivers) {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let out = drivers.filter(d => {
    if (q && !( (d.name || '').toLowerCase().includes(q) ||
                (d.location || '').toLowerCase().includes(q) ||
                (d.vehicle_make || '').toLowerCase().includes(q) ||
                (d.vehicle_model || '').toLowerCase().includes(q))) return false;
    if (activeFilter === 'all')    return true;
    if (activeFilter === 'active') return d.status === 'active';
    return (d.approved_services || []).includes(activeFilter);
  });

  out.sort((a, b) => {
    if (sort === 'trips') return (b.total_trips || 0) - (a.total_trips || 0);
    if (sort === 'acceptance') {
      const ra = acceptanceRate(tripsByDriver[a.id] || []) ?? -1;
      const rb = acceptanceRate(tripsByDriver[b.id] || []) ?? -1;
      return rb - ra;
    }
    if (sort === 'rating') return (b.rating || 0) - (a.rating || 0);
    return (a.name || '').localeCompare(b.name || '');
  });
  return out;
}

function renderDrivers() {
  const wrap = document.getElementById('driversWrap');
  const drivers = filterAndSort(allDrivers);
  if (!drivers.length) { wrap.innerHTML = '<div class="empty">No drivers match your filters.</div>'; return; }
  wrap.innerHTML = drivers.map(d => driverCardHTML(d)).join('');

  // Attach events
  wrap.querySelectorAll('.driver-summary').forEach(el => {
    el.addEventListener('click', () => {
      const card = el.closest('.driver-card');
      const wasOpen = card.classList.contains('expanded');
      wrap.querySelectorAll('.driver-card.expanded').forEach(c => c.classList.remove('expanded'));
      if (!wasOpen) {
        card.classList.add('expanded');
        // Animate bars after expand
        setTimeout(() => animateBars(card), 50);
      }
    });
  });

  wrap.querySelectorAll('.rc-tab').forEach(tab => {
    tab.addEventListener('click', e => {
      e.stopPropagation();
      const card = tab.closest('.driver-card');
      card.querySelectorAll('.rc-tab').forEach(t => t.classList.remove('active'));
      card.querySelectorAll('.rc-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      card.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    });
  });
}

function driverCardHTML(d) {
  const trips = tripsByDriver[d.id] || [];
  const acc   = acceptanceRate(trips);
  const services = (d.approved_services || []);
  const color = avatarColor(d.name);
  const statusDot = { active: '#10b981', inactive: '#64748b', suspended: '#ef4444' }[d.status] || '#64748b';
  const badgeCls  = { active: 'badge-active', inactive: 'badge-inactive', suspended: 'badge-suspended' }[d.status] || 'badge-inactive';
  const flags = complianceFlags(d);

  // Acceptance ring SVG
  const pct = acc ?? 0;
  const r = 20, circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  const ringColor = pct >= 80 ? '#10b981' : pct >= 60 ? '#f59e0b' : '#ef4444';

  // Overall grade
  const completion = trips.length ? Math.round(trips.filter(t => t.status === 'completed').length / trips.length * 100) : null;
  const avgScore = [acc, completion, d.rating ? d.rating * 20 : null].filter(x => x !== null);
  const overallPct = avgScore.length ? Math.round(avgScore.reduce((a, b) => a + b, 0) / avgScore.length) : null;
  const gradeVal = overallPct !== null ? grade(overallPct) : '—';

  return `
  <div class="driver-card" data-driver-id="${d.id}">
    <div class="driver-summary">
      <div class="avatar" style="background:${color}">
        ${initials(d.name)}
        <span class="status-dot" style="background:${statusDot}"></span>
      </div>
      <div class="driver-meta">
        <div class="driver-name">${d.name || 'Unknown Driver'}</div>
        <div class="driver-loc">📍 ${d.location || d.city || 'No location'} &nbsp;·&nbsp; ${d.vehicle_year || ''} ${d.vehicle_make || ''} ${d.vehicle_model || ''} (${d.vehicle_type || '?'})</div>
        <div class="service-pills">
          ${services.map(s => `<span class="service-pill pill-${s}">${s.toUpperCase()}</span>`).join('')}
          ${flags.length ? `<span class="service-pill" style="background:rgba(239,68,68,0.15);color:#fca5a5">⚠ ${flags.length} Flag${flags.length > 1 ? 's' : ''}</span>` : ''}
        </div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="mini-stat-val">${d.total_trips ?? trips.filter(t=>t.status==='completed').length}</div>
          <div class="mini-stat-lbl">Trips</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-val">${d.rating ? Number(d.rating).toFixed(1) : '—'}</div>
          <div class="mini-stat-lbl">Rating</div>
        </div>
      </div>
      <div class="acceptance-ring">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
          <circle cx="26" cy="26" r="${r}" fill="none" stroke="${ringColor}" stroke-width="5"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div class="ring-val">${acc !== null ? acc + '%' : '—'}</div>
      </div>
      <span class="status-badge ${badgeCls}">${(d.status || 'inactive').toUpperCase()}</span>
      <div class="chevron">⌄</div>
    </div>

    <!-- Report Card -->
    <div class="report-card">
      <div class="rc-tabs">
        <div class="rc-tab active" data-tab="overview">📋 Overview</div>
        <div class="rc-tab" data-tab="trips">🚗 Load Details</div>
        <div class="rc-tab" data-tab="performance">📊 Performance</div>
        <div class="rc-tab" data-tab="places">📍 Places</div>
        <div class="rc-tab" data-tab="compliance">🛡 Compliance</div>
      </div>

      <!-- OVERVIEW -->
      <div class="rc-panel active" data-panel="overview">
        <div class="grade-panel">
          <div class="grade-circle grade-${gradeVal}">
            <div class="grade-letter">${gradeVal}</div>
            <div class="grade-sub">GRADE</div>
          </div>
          <div class="grade-detail">
            <h3>${d.name}</h3>
            <p>${gradeDescription(gradeVal)} &nbsp;·&nbsp; ${(d.plan || 'starter').replace('_', ' ').toUpperCase()} PLAN</p>
            <p style="margin-top:6px;font-size:11px;color:var(--subtext)">
              ${trips.filter(t=>t.status==='in_progress').length > 0 ? '🟢 On an active trip right now' : '⚪ Currently off-duty'}
            </p>
          </div>
        </div>
        <div class="sec-hdr">Driver Information</div>
        <div class="info-grid">
          <div class="info-item"><label>Phone</label><span>${d.phone || '—'}</span></div>
          <div class="info-item"><label>Email</label><span>${d.email || '—'}</span></div>
          <div class="info-item"><label>Home Base</label><span>${d.location || '—'}</span></div>
          <div class="info-item"><label>Vehicle</label><span>${d.vehicle_year || ''} ${d.vehicle_make || ''} ${d.vehicle_model || ''}</span></div>
          <div class="info-item"><label>Vehicle Type</label><span>${(d.vehicle_type || '—').replace('_',' ')}</span></div>
          <div class="info-item"><label>License #</label><span>${d.license_number || '—'} (${d.license_state || '?'})</span></div>
          <div class="info-item"><label>MVR Status</label><span style="color:${d.mvr_status==='clear'?'var(--green)':d.mvr_status==='flagged'?'var(--red)':'var(--yellow)'}">
            ${(d.mvr_status || 'pending').toUpperCase()}</span></div>
          <div class="info-item"><label>Background Check</label><span style="color:${d.background_check_status==='clear'?'var(--green)':d.background_check_status==='flagged'?'var(--red)':'var(--yellow)'}">
            ${(d.background_check_status || 'pending').toUpperCase()}</span></div>
          <div class="info-item"><label>Member Since</label><span>${fmtDate(d.created_at)}</span></div>
          <div class="info-item"><label>Activated</label><span>${fmtDate(d.activated_at)}</span></div>
        </div>
        <div class="sec-hdr">Approved Services</div>
        <div class="service-pills" style="margin-bottom:16px">
          ${(d.approved_services || []).length ? (d.approved_services||[]).map(s=>`<span class="service-pill pill-${s}">${s.toUpperCase()}</span>`).join('') : '<span style="color:var(--subtext);font-size:13px">None assigned</span>'}
        </div>
        <div class="sec-hdr">Opted-In Platforms</div>
        <div class="service-pills">
          ${(d.platforms_opted_in || []).length ? (d.platforms_opted_in||[]).map(p=>`<span class="service-pill" style="background:rgba(255,255,255,0.08);color:var(--text)">${p}</span>`).join('') : '<span style="color:var(--subtext);font-size:13px">None yet</span>'}
        </div>
      </div>

      <!-- LOAD DETAILS -->
      <div class="rc-panel" data-panel="trips">
        ${tripsHTML(trips)}
      </div>

      <!-- PERFORMANCE -->
      <div class="rc-panel" data-panel="performance">
        ${performanceHTML(d, trips, acc)}
      </div>

      <!-- PLACES OF INTEREST -->
      <div class="rc-panel" data-panel="places">
        ${placesHTML(d, trips)}
      </div>

      <!-- COMPLIANCE -->
      <div class="rc-panel" data-panel="compliance">
        ${complianceHTML(d, flags)}
      </div>
    </div>
  </div>`;
}

function tripsHTML(trips) {
  const active = trips.filter(t => ['in_progress','assigned','pending'].includes(t.status));
  const recent = trips.filter(t => t.status === 'completed').slice(0, 10);
  let html = '';

  if (active.length) {
    html += `<div class="sec-hdr">Active Loads (${active.length})</div>
    <table class="trip-table" style="margin-bottom:20px">
      <thead><tr><th>Type</th><th>Pickup</th><th>Dropoff</th><th>Rate</th><th>Status</th><th>Scheduled</th></tr></thead>
      <tbody>
        ${active.map(t => `<tr>
          <td><span class="trip-type-badge pill-${t.trip_type||'gig'}">${(t.trip_type||'gig').toUpperCase()}</span></td>
          <td>${t.pickup_address || '—'}</td>
          <td>${t.dropoff_address || '—'}</td>
          <td>${fmtCurrency(t.rate_total)}</td>
          <td><span class="trip-status-badge st-${t.status}">${t.status.replace('_',' ').toUpperCase()}</span></td>
          <td>${fmtDate(t.scheduled_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }

  html += `<div class="sec-hdr">Recent Completed Loads (${recent.length})</div>`;
  if (!recent.length) return html + '<div class="empty">No completed trips yet.</div>';

  html += `<table class="trip-table">
    <thead><tr><th>Type</th><th>Pickup</th><th>Dropoff</th><th>Miles</th><th>Rate</th><th>Payout</th><th>Date</th></tr></thead>
    <tbody>
      ${recent.map(t => `<tr>
        <td><span class="trip-type-badge pill-${t.trip_type||'gig'}">${(t.trip_type||'gig').toUpperCase()}</span></td>
        <td>${t.pickup_address || '—'}</td>
        <td>${t.dropoff_address || '—'}</td>
        <td>${t.estimated_miles ? Number(t.estimated_miles).toFixed(0)+'mi' : '—'}</td>
        <td>${fmtCurrency(t.rate_total)}</td>
        <td>${fmtCurrency(t.driver_payout)}</td>
        <td>${fmtDate(t.completed_at)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
  return html;
}

function performanceHTML(d, trips, acc) {
  const completed = trips.filter(t => t.status === 'completed');
  const cancelled  = trips.filter(t => t.status === 'cancelled');
  const total = trips.length;
  const compRate = total ? Math.round(completed.length / total * 100) : null;
  const rating   = d.rating ? Math.round(Number(d.rating) * 20) : null;

  const metrics = [
    { name: 'Acceptance Rate', val: acc,      suffix: '%' },
    { name: 'Completion Rate', val: compRate, suffix: '%' },
    { name: 'Driver Rating',   val: rating,   suffix: '%', display: d.rating ? Number(d.rating).toFixed(1) + ' / 5.0' : null },
  ];

  const totalEarnings = completed.reduce((s,t) => s + (t.driver_payout || 0), 0);
  const avgEarnings   = completed.length ? totalEarnings / completed.length : 0;

  let html = `<div class="sec-hdr">Performance Metrics</div>`;
  html += metrics.map(m => {
    if (m.val === null) return `<div class="metric-row">
      <div class="metric-top"><span class="metric-name">${m.name}</span><span class="metric-val" style="color:var(--subtext)">No data</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:0%;background:var(--gray)"></div></div>
    </div>`;
    const g = grade(m.val);
    return `<div class="metric-row">
      <div class="metric-top">
        <span class="metric-name">${m.name}</span>
        <span class="metric-val" style="color:${barColor(m.val)}">${m.display || (m.val + m.suffix)} <small style="font-size:10px;color:var(--subtext)">(${g})</small></span>
      </div>
      <div class="bar-track"><div class="bar-fill" data-width="${m.val}" style="width:0%;background:${barColor(m.val)}"></div></div>
    </div>`;
  }).join('');

  html += `<div class="sec-hdr" style="margin-top:20px">Earnings Summary</div>
  <div class="info-grid">
    <div class="info-item"><label>Total Completed</label><span>${completed.length} trips</span></div>
    <div class="info-item"><label>Cancelled</label><span>${cancelled.length} trips</span></div>
    <div class="info-item"><label>Total Earnings</label><span style="color:var(--green);font-weight:700">${fmtCurrency(totalEarnings)}</span></div>
    <div class="info-item"><label>Avg Earnings / Trip</label><span>${fmtCurrency(avgEarnings)}</span></div>
  </div>`;

  // Segment breakdown
  const byType = {};
  for (const t of completed) byType[t.trip_type||'unknown'] = (byType[t.trip_type||'unknown']||0)+1;
  if (Object.keys(byType).length > 0) {
    html += `<div class="sec-hdr" style="margin-top:20px">Trip Type Breakdown</div>
    <div class="service-pills">
      ${Object.entries(byType).map(([type, cnt]) => `<span class="service-pill pill-${type}" style="font-size:12px;padding:4px 10px">${type.toUpperCase()} · ${cnt}</span>`).join('')}
    </div>`;
  }
  return html;
}

function placesHTML(d, trips) {
  const poi = topPOI(trips);
  const maxCount = poi.length ? poi[0][1] : 1;

  let html = `<div class="sec-hdr">Home Base</div>
  <div class="poi-item" style="margin-bottom:16px">
    <div class="poi-rank">🏠</div>
    <div>
      <div class="poi-name">${d.location || d.city || 'Not set'}</div>
      <div class="poi-count">Registered home location</div>
    </div>
  </div>`;

  if (d.last_lat && d.last_lng) {
    html += `<div class="sec-hdr">Last Known Location</div>
    <div class="poi-item" style="margin-bottom:16px">
      <div class="poi-rank">📡</div>
      <div>
        <div class="poi-name">${Number(d.last_lat).toFixed(4)}, ${Number(d.last_lng).toFixed(4)}</div>
        <div class="poi-count">Last ping: ${fmtDate(d.last_ping_at)}</div>
      </div>
    </div>`;
  }

  html += `<div class="sec-hdr">Top Pickup Zones (by trip count)</div>`;
  if (!poi.length) return html + '<div class="empty">No trip history to build location data.</div>';

  html += `<div class="poi-list">
    ${poi.map(([city, cnt], i) => `
    <div class="poi-item">
      <div class="poi-rank">${i + 1}</div>
      <div style="flex:1;min-width:0">
        <div class="poi-name">${city}</div>
        <div class="poi-count">${cnt} pickup${cnt > 1 ? 's' : ''}</div>
      </div>
      <div class="poi-bar"><div class="poi-fill" style="width:${Math.round(cnt/maxCount*100)}%"></div></div>
    </div>`).join('')}
  </div>`;
  return html;
}

function complianceHTML(d, flags) {
  const items = [
    {
      icon: '🪪', label: "Driver's License",
      sub: `${d.license_number || '—'} · ${d.license_state || '?'}`,
      ...expiry(d.license_expires)
    },
    {
      icon: '🚗', label: 'Vehicle Insurance',
      sub: 'Required for all trips',
      ...expiry(d.vehicle_insurance_expires)
    },
    {
      icon: '🔍', label: 'MVR Check',
      sub: d.mvr_checked_at ? 'Last checked ' + fmtDate(d.mvr_checked_at) : 'Not checked',
      label2: (d.mvr_status || 'pending').toUpperCase(),
      cls: d.mvr_status === 'clear' ? 'comp-ok' : d.mvr_status === 'flagged' ? 'comp-bad' : 'comp-warn'
    },
    {
      icon: '✅', label: 'Background Check',
      sub: d.background_checked_at ? 'Checked ' + fmtDate(d.background_checked_at) : 'Pending',
      label2: (d.background_check_status || 'pending').toUpperCase(),
      cls: d.background_check_status === 'clear' ? 'comp-ok' : d.background_check_status === 'flagged' ? 'comp-bad' : 'comp-warn'
    },
  ];

  let html = `<div class="sec-hdr">Compliance Status</div>
  <div class="compliance-list">
    ${items.map(it => `
    <div class="compliance-item">
      <div class="comp-icon">${it.icon}</div>
      <div class="comp-text">
        <div class="comp-label">${it.label}</div>
        <div class="comp-sub">${it.sub || ''}</div>
      </div>
      <span class="comp-status ${it.cls}">${it.label2 || it.label || ''}</span>
    </div>`).join('')}
  </div>`;

  if (flags.length) {
    html += `<div class="sec-hdr" style="margin-top:20px">Open Flags (${flags.length})</div>
    <div class="compliance-list">
      ${flags.map(f => `
      <div class="compliance-item">
        <div class="comp-icon">${f.urgency === 'bad' ? '🚨' : '⚠️'}</div>
        <div class="comp-text"><div class="comp-label">${f.label}</div><div class="comp-sub">Requires attention</div></div>
        <span class="comp-status ${f.urgency === 'bad' ? 'comp-bad' : 'comp-warn'}">${f.urgency === 'bad' ? 'CRITICAL' : 'WARNING'}</span>
      </div>`).join('')}
    </div>`;
  } else {
    html += `<div style="margin-top:16px;padding:14px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:10px;text-align:center;font-size:13px;color:var(--green)">
      ✓ All compliance checks clear
    </div>`;
  }
  return html;
}

function animateBars(card) {
  card.querySelectorAll('.bar-fill[data-width]').forEach(el => {
    el.style.width = el.dataset.width + '%';
  });
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderDrivers();
  });
});
document.getElementById('searchBox').addEventListener('input', renderDrivers);
document.getElementById('sortSelect').addEventListener('change', renderDrivers);

// Auto-refresh every 60s
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
